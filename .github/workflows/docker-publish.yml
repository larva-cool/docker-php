name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # Image name as <account>/php
  IMAGE_NAME: ${{ github.repository_owner }}/php


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      # Build all PHP images with the repository script (don't push on PR)
      - name: Build Docker images
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          image_repo="${IMAGE_REPO,,}"
          bash ./build-images.sh --repo "${image_repo}"

      - name: Push Docker images
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          image_repo="${IMAGE_REPO,,}"
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=${image_repo}:*")
          for image in "${images[@]}"; do
            docker push "${image}"
          done

      # Sign every published Docker image digest except on PRs.
      - name: Sign the published Docker images
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          image_repo="${IMAGE_REPO,,}"
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=${image_repo}:*")
          for image in "${images[@]}"; do
            remote_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}")"
            cosign sign --yes "${remote_ref}"
          done
